[bar]
width = 100%
height = 30
background = #222222
foreground = #ffffff
border-size = 0
border-color = #000000

modules-left = date
modules-center = 
modules-right = cpu memory

[date]
label = %Y-%m-%d %H:%M:%S
format = 1

[cpu]
label = CPU: %percentage%%
format = 1

[memory]
label = RAM: %used%/%total% MB
format = 1